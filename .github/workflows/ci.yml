name: CI & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Go 1.24+ emits the LC_UUID metadata required by current macOS.
          go-version: 'stable'
          check-latest: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run Go tests
        run: go test -v ./...

      - name: Build binary
        run: go build -v -o pocket-terminal .
