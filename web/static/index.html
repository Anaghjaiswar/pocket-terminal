<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e1e2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PocketTerminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- Top Status Header -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">&gt;_</span>
        <span class="brand-name">PocketTerminal</span>
      </div>
      <div class="status-cluster">
        <!-- Shell Selector Button -->
        <button id="shellPickerBtn" class="chip-btn shell-btn" type="button" title="Create a terminal with another shell">
          <span id="activeShellIcon">&#9889;</span> <span id="activeShellName">PowerShell</span>
        </button>
        <button id="promptModalBtn" class="chip-btn" type="button" title="Compose multi-line or voice prompt">
          Prompt Box
        </button>
        <div id="connBadge" class="conn-badge connecting">
          <span class="dot"></span>
          <span id="connText">Connecting</span>
        </div>
      </div>
    </header>

    <section class="project-bar" aria-label="Project terminals">
      <form id="projectForm">
        <label for="projectPath">Project</label>
        <input id="projectPath" placeholder="Server project folder" aria-label="Project folder on laptop" />
        <button id="browseProjectBtn" class="chip-btn" type="button" aria-haspopup="dialog">Browse ▾</button>
        <button class="chip-btn" type="submit">Open</button>
      </form>
      <button id="newSessionBtn" class="chip-btn" type="button">+ Terminal</button>
    </section>
    <nav id="sessionTabs" class="session-tabs" aria-label="Terminal sessions"></nav>
    <div id="sessionError" class="session-error hidden" role="alert"></div>

    <div id="folderPicker" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="folderPickerTitle">
      <div class="modal-box folder-picker-box">
        <div class="modal-header">
          <h3 id="folderPickerTitle">Choose Project Folder</h3>
          <button id="folderPickerClose" class="icon-close" type="button" aria-label="Close folder picker">&times;</button>
        </div>
        <label class="folder-drive-label" for="folderDrive">Drive</label>
        <select id="folderDrive" aria-label="Select a laptop drive"></select>
        <form id="folderPathForm" class="folder-path-form">
          <input id="folderPath" aria-label="Folder path" placeholder="Enter a folder path" />
          <button class="chip-btn" type="submit">Go</button>
        </form>
        <button id="folderUp" class="chip-btn" type="button">↑ Parent folder</button>
        <p id="folderMessage" class="folder-message" role="status"></p>
        <div id="folderList" class="folder-list" aria-label="Folders"></div>
        <button id="selectFolderBtn" class="drawer-btn primary" type="button" disabled>Open This Project</button>
      </div>
    </div>

    <!-- Main Terminal Viewport -->
    <main id="terminal-wrapper">
      <div id="terminal"></div>

      <!-- Floating Voice-to-Text Dictation Button -->
      <button id="voiceBtn" class="fab-mic" type="button" aria-label="Voice Dictation" title="Speak prompt into terminal">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
        <span id="voiceBadge" class="voice-badge hidden">Listening...</span>
      </button>

      <!-- Live Voice / Prompt Composer Drawer -->
      <div id="promptDrawer" class="prompt-drawer hidden">
        <div class="drawer-header">
          <span id="drawerTitle">Voice &amp; Prompt Composer</span>
          <div class="drawer-actions">
            <label class="auto-enter-toggle">
              <input type="checkbox" id="autoEnterCheck" checked />
              <span>Auto-Enter</span>
            </label>
            <button id="drawerCloseBtn" class="icon-close" type="button" aria-label="Close">&times;</button>
          </div>
        </div>
        <textarea id="promptInput" rows="3" placeholder="Speak with the mic or type a prompt for Aider / Codex / Git..."></textarea>
        <div class="drawer-footer">
          <button id="drawerMicBtn" class="drawer-btn secondary" type="button">Dictate</button>
          <button id="drawerSendBtn" class="drawer-btn primary" type="button">Send to Terminal</button>
        </div>
      </div>

      <!-- Shell Choice Modal -->
      <div id="shellModal" class="modal-overlay hidden">
        <div class="modal-box">
          <div class="modal-header">
            <h3>New Terminal Session</h3>
            <button id="shellModalClose" class="icon-close" type="button">&times;</button>
          </div>
          <p class="modal-sub">Create a terminal in this project. Existing sessions keep running.</p>
          <div class="shell-grid">
            <button class="shell-card" data-shell="gitbash" type="button">
              <span class="shell-icon">&#128025;</span>
              <div class="shell-meta">
                <span class="shell-title">Git Bash</span>
                <span class="shell-desc">MINGW64 / Linux commands &amp; tools</span>
              </div>
            </button>
            <button class="shell-card active" data-shell="powershell" type="button">
              <span class="shell-icon">&#9889;</span>
              <div class="shell-meta">
                <span class="shell-title">PowerShell</span>
                <span class="shell-desc">Windows default shell</span>
              </div>
            </button>
            <button class="shell-card" data-shell="cmd" type="button">
              <span class="shell-icon">&#128187;</span>
              <div class="shell-meta">
                <span class="shell-title">Command Prompt</span>
                <span class="shell-desc">Classic Windows cmd.exe</span>
              </div>
            </button>
            <button class="shell-card" data-shell="wsl" type="button">
              <span class="shell-icon">&#128039;</span>
              <div class="shell-meta">
                <span class="shell-title">WSL (Ubuntu)</span>
                <span class="shell-desc">Native Linux environment</span>
              </div>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Persistent Mobile Touch Keypad Bar with Shortcut Keys -->
    <nav class="touch-toolbar" aria-label="Developer Shortcut Keys">
      <button class="key-btn modifier" id="ctrlToggle" data-action="toggle-ctrl" type="button">Ctrl</button>
      <button class="key-btn modifier" id="altToggle" data-action="toggle-alt" type="button">Alt</button>
      <button class="key-btn accent" data-action="paste" type="button" title="Paste from mobile clipboard">&#128203; Paste</button>
      <button class="key-btn" data-action="ctrl-d" type="button" title="EOF / Exit REPL">Ctrl+D</button>
      <button class="key-btn danger" data-action="ctrl-c" type="button" title="Interrupt Process">Ctrl+C</button>
      <button class="key-btn" data-action="esc" type="button">Esc</button>
      <button class="key-btn" data-action="tab" type="button">Tab</button>
      <button class="key-btn" data-action="left" type="button">&larr;</button>
      <button class="key-btn" data-action="right" type="button">&rarr;</button>
      <button class="key-btn" data-action="up" type="button">&uarr;</button>
      <button class="key-btn" data-action="down" type="button">&darr;</button>
      <button class="key-btn" data-action="enter" type="button">Enter</button>
      <button class="key-btn subtle" data-action="clear" type="button">Clear</button>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
